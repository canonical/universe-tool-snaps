name: libgpiod
base: core26
adopt-info: libgpiod
summary: libgpiod runtime library as a content snap
description: |
  Ships libgpiod.so.3 from the Ubuntu 26.04 archive (deb libgpiod3) and
  shares it over the "libgpiod3" content interface, so tool snaps such as
  gpiod can use it on Ubuntu Core. See INSTALL-MATRIX.md for when you need it.
grade: stable
confinement: strict
license: LGPL-2.1-or-later
platforms:
  amd64:
  arm64:

slots:
  libgpiod:
    interface: content
    content: libgpiod3 # library ABI, not project name: a v2 tool must never mount libgpiod2
    read:
      - $SNAP/lib

parts:
  libgpiod:
    plugin: nil
    stage-packages:
      - libgpiod3
    organize:
      usr/lib/*/libgpiod.so*: lib/ # arch-neutral path for the slot
    prime:
      - lib/libgpiod.so*
      - usr/share/doc/*/copyright
    override-build: |
      craftctl default
      ver="$(apt-cache policy libgpiod3 | awk '/Candidate:/{print $2}')"
      craftctl set version="$(printf '%s' "$ver" | tr ':' '-' | cut -c1-32)"
